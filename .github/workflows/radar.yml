name: Papeleta Blanca

on:
  schedule:
    - cron: "15 7 * * *"    # cada mañana: 8:15 en Madrid (hora de invierno)
    - cron: "15 17 * * *"   # y por la tarde, por si el BOE publica algo fuera de hora
  push:
    branches: [main]        # cada vez que subes un cambio (p. ej. una ficha), se regenera la web
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer día del BOE a revisar (AAAA-MM-DD). Vacío = solo hoy"
        required: false

permissions:
  contents: read

concurrency:
  group: papeleta-blanca
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-24.04   # fijo durante la campaña: ubuntu-latest cambia a Ubuntu 26 el 19 de octubre
    timeout-minutes: 15
    permissions:
      contents: write       # para guardar los datos nuevos en el repositorio
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python -m unittest discover tests
      - name: Revisar el BOE y las candidaturas
        env:
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          if [ -n "$DESDE" ]; then
            python radar.py --desde "$DESDE"
            python candidaturas.py --desde "$DESDE"
          else
            python radar.py
            python candidaturas.py
          fi
      - name: Guardar datos nuevos
        run: |
          git config user.name "Papeleta Blanca"
          git config user.email "hola@papeletablanca.es"
          git add datos
          git diff --cached --quiet || git commit -m "Datos BOE $(date -u +%F)"
          git pull --rebase   # por si has subido un cambio mientras se revisaba el BOE
          git push

  web:
    needs: datos
    runs-on: ubuntu-24.04   # fijo durante la campaña: ubuntu-latest cambia a Ubuntu 26 el 19 de octubre
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # incluye los datos que acaba de guardar el paso anterior
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - name: Construir la web
        working-directory: web
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publicar:
    needs: web
    runs-on: ubuntu-24.04   # fijo durante la campaña: ubuntu-latest cambia a Ubuntu 26 el 19 de octubre
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
